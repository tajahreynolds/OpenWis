[project]
name = "open-wisdom-stack"
version = "0.0.0"
description = "Integration toolkit connecting Pol.is, NarraFirma, Hypha, and a metrics dashboard."
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
