[project]
name = "open-wisdom-stack"
version = "0.0.0"
description = "Integration toolkit connecting Pol.is, NarraFirma, Hypha, and a metrics dashboard."
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "live: talks to a real Pol.is instance; runs only with POLIS_LIVE_TESTS=1",
]

[tool.coverage.run]
source = ["scripts"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade,
# D pydocstyle (enforces the AGENTS.md docstring rule).
select = ["E", "W", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
