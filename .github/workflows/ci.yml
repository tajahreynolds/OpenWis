name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests with coverage gate
        id: tests
        # Coverage needs code to measure. Until scripts/ has Python files
        # the gate is skipped (DECISION-006); it applies automatically after.
        run: |
          if find scripts -name '*.py' | grep -q .; then
            echo "measured=true" >> "$GITHUB_OUTPUT"
            pytest --cov --cov-report=term-missing --cov-report=xml
          else
            echo "measured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Python files under scripts/; coverage gate skipped."
            echo "Coverage gate skipped: no Python files under \`scripts/\`." >> "$GITHUB_STEP_SUMMARY"
            pytest
          fi
      - name: Coverage report
        if: always() && steps.tests.outputs.measured == 'true'
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.tests.outputs.measured == 'true'
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
